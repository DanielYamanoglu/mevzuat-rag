[project]
name = "mevzuat-rag"
version = "0.1.0"
description = "Evaluated, guarded RAG over Turkish banking and data-protection legislation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "rank-bm25>=0.2.2",
    "fastembed>=0.4",
    "numpy>=1.26",
    "langgraph>=0.2",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]
experiments = [
    "chromadb>=0.5",
    "llama-index-core>=0.12",
    "llama-index-embeddings-huggingface>=0.9.0",
    "llama-index-vector-stores-chroma>=0.7.0",
    "sentence-transformers>=3",
]

[project.scripts]
mevzuat-rag = "mevzuat_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mevzuat_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
